<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スマホ3年総コスト診断 | 学生スマホコスト研究所</title><meta name="description" content="スマホ料金、Wi-Fi、端末代、売却額から3年間の総コストを比較"><style>
:root{--bg:#fafafa;--card:#fff;--text:#171717;--muted:#666;--line:#e7e7e7;--accent:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.75}a{color:#0b57d0}header,main,footer{max-width:920px;margin:auto;padding:20px}.hero{padding:54px 20px 24px}.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.08;margin:0 0 16px}.lead{font-size:18px;color:var(--muted);max-width:720px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}.ad{font-size:13px;background:#f0f3f6;border-radius:10px;padding:12px;color:#444}.meta{font-size:13px;color:var(--muted)}h2{margin-top:42px}h3{margin-top:30px}.cta{display:inline-block;padding:12px 18px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:700}.cta:is(button){border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.calc label{display:block;font-weight:600;margin:10px 0 4px}.calc input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}.result{font-size:24px;font-weight:750}.article-list li{margin:10px 0}footer{color:var(--muted);font-size:13px;padding-bottom:50px}@media(max-width:600px){header,main,footer{padding:16px}}
</style></head><body><header><a href="index.html">学生スマホコスト研究所</a>　<a href="calculator.html">総コスト診断</a>　<a href="about.html">編集方針</a>　<a href="privacy.html">プライバシー</a></header><main><h1>スマホ3年総コスト診断</h1><p>キャリア名ではなく、いま支払っている総額と、見直し後の想定額を比較します。入力値はブラウザ内だけで計算され、送信されません。</p><div class="card calc"><div class="grid"><div><label for="m1">現在のスマホ料金（月）</label><input id="m1" type="number" value="5000" min="0"><label for="w1">現在のWi-Fi（月）</label><input id="w1" type="number" value="4000" min="0"><label for="d1">端末の実質月負担</label><input id="d1" type="number" value="2500" min="0"></div><div><label for="m2">見直し後スマホ料金（月）</label><input id="m2" type="number" value="3000" min="0"><label for="w2">見直し後Wi-Fi（月）</label><input id="w2" type="number" value="0" min="0"><label for="d2">見直し後端末の月負担</label><input id="d2" type="number" value="2500" min="0"></div></div><label for="sale">旧端末の想定売却額</label><input id="sale" type="number" value="20000" min="0"><p><button class="cta" type="button" onclick="calc()">計算する</button></p><div aria-live="polite"><p>現在の3年総額: <span id="old" class="result">-</span></p><p>見直し後3年総額: <span id="new" class="result">-</span></p><p>3年間の差額: <span id="save" class="result">-</span></p></div></div><div class="card"><h2>次に見るポイント</h2><p>差額が大きい場合でも、通信エリア、必要データ量、オンライン授業・ゲーム・動画利用、解約金や端末残債などを確認してから変更してください。</p><p><a href="index.html">条件別ガイドを見る</a></p></div><script>function yen(n){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n)}function v(id){return Math.max(0,Number(document.getElementById(id).value)||0)}function calc(){let old=(v('m1')+v('w1')+v('d1'))*36;let neu=(v('m2')+v('w2')+v('d2'))*36-v('sale');document.getElementById('old').textContent=yen(old);document.getElementById('new').textContent=yen(neu);document.getElementById('save').textContent=yen(old-neu)}calc()</script></main><footer>© 2026 学生スマホコスト研究所 / <a href="about.html">広告・編集方針</a> / <a href="privacy.html">プライバシー</a></footer></body></html>
